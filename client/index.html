<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EatzUp – Order delicious food from top local restaurants. Fast delivery, fresh meals, and the best deals near you." />
    <meta name="keywords" content="food delivery, order food online, restaurants near me, EatzUp" />
    <meta name="theme-color" content="#E8303A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <title>EatzUp – Food Delivered Fast</title>
  </head>
  <body>
    <div id="app-splash" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#F5F0EB;pointer-events:none;">
      <div style="font-family:'Playfair Display',serif;font-size:2.6rem;font-weight:900;color:#E8303A;letter-spacing:-1px;">EatzUp</div>
      <div style="width:180px;height:3px;background:rgba(232,48,58,0.12);border-radius:99px;overflow:hidden;">
        <div id="splash-bar" style="height:100%;background:linear-gradient(90deg,#E8303A,#C1272D);border-radius:99px;width:0%;transition:width 0.9s ease;"></div>
      </div>
    </div>
    <script>
      setTimeout(function(){ var b=document.getElementById('splash-bar'); if(b) b.style.width='100%'; }, 60);
      setTimeout(function(){ var s=document.getElementById('app-splash'); if(s){ s.style.transition='opacity 0.4s'; s.style.opacity='0'; setTimeout(function(){ s.remove(); },420); } }, 1100);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
